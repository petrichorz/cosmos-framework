# Formal Scheme-B causal teacher-forcing training recipe for Cosmos3-Edge.
# Keep this recipe aligned with vision_sft_edge.toml and launch it with the
# mot_causal_fsdp Hydra model group so OmniMoTCausalModel is instantiated.

[job]
task         = "vfm"
experiment   = "vision_sft_edge"
project      = "cosmos3"
group        = "causal_sft"
name         = "vision_causal_edge"
wandb_mode   = "disabled"

[model]
max_num_tokens_after_packing              = 45056
joint_attn_implementation                 = "two_way"
precision                                 = "bfloat16"
causal_training_strategy                  = "teacher_forcing"
teacher_forcing_block_size_min            = 1
teacher_forcing_block_size_max            = 4
teacher_forcing_history_blocks_min        = 1
teacher_forcing_history_blocks_max        = 32
# Scheme B expands at most 45,056 packed tokens to [UND|clean|noisy], whose
# one-dimensional length is bounded by 2 * 45,056.
teacher_forcing_max_sequence_length       = 90112

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = -1
data_parallel_replicate_degree = 1

[model.compile]
enabled         = true
compile_dynamic = true

[model.activation_checkpointing]
mode               = "full"
save_ops_regex     = ["fmha"]
preserve_rng_state = true
determinism_check  = "default"

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
betas          = [0.9, 0.95]
eps            = 1.0e-6
fused          = true
keys_to_select = [
    "moe_gen",
    "time_embedder",
    "vae2llm",
    "llm2vae",
    "k_norm_und_for_gen",
]
lr           = 1.0e-4
weight_decay = 0

[scheduler]
cycle_lengths      = [1000]
f_max              = [1.0]
f_min              = [0.0]
f_start            = [0.0]
verbosity_interval = 0
warm_up_steps      = [50]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter         = 2
logging_iter            = 1
max_iter                = 500

[trainer.callbacks.compile_tokenizer]
compile_after_iterations = 3
enabled                  = false

[trainer.callbacks.grad_clip]
clip_norm    = 0.1
force_finite = true

[checkpoint]
keys_to_skip_loading = ["net_ema."]
load_path            = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter            = 100

[dataloader_train]
max_sequence_length = 45056
max_caption_tokens   = 2048
