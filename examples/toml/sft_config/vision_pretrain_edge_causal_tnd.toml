# Template for Cosmos3-Edge causal continued pre-training with grouped TND attention.
# The paired launcher restricts conditioning to T2V, which is the training mode
# currently supported by Scheme-B teacher forcing.

[job]
task         = "vfm"
experiment   = "vision_sft_edge_lerobot3"
project      = "cosmos3"
group        = "causal_pretrain"
name         = "vision_causal_edge_tnd_pretrain"
wandb_mode   = "offline"

[model]
precision                           = "bfloat16"
joint_attn_implementation           = "teacher_forcing"
causal_training_strategy            = "teacher_forcing"
teacher_forcing_block_size_min      = 1
teacher_forcing_block_size_max      = 4
teacher_forcing_history_blocks_min  = 1
teacher_forcing_history_blocks_max  = 64
teacher_forcing_dense_mode          = "grouped_tnd"
teacher_forcing_tnd_max_kv_tokens   = 131072
teacher_forcing_visualize_sdpa_mask = false

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = -1
data_parallel_replicate_degree = 1
fsdp_mixed_precision_enabled   = true
fsdp_master_dtype              = "float32"

[model.compile]
enabled         = false
compile_dynamic = true

[model.activation_checkpointing]
mode               = "full"
save_ops_regex     = ["fmha"]
preserve_rng_state = true
determinism_check  = "default"

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
betas          = [0.9, 0.99]
eps            = 1.0e-6
fused          = true
keys_to_select = [
    "moe_gen",
    "time_embedder",
    "vae2llm",
    "llm2vae",
    "k_norm_und_for_gen",
]
lr           = 1.0e-4
weight_decay = 0.05

[scheduler]
lr_scheduler_type = "LambdaLinear"
cycle_lengths      = [2000]
f_max              = [1.0]
f_min              = [0.3]
f_start            = [0.0]
verbosity_interval = 0
warm_up_steps      = [50]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter         = 1
logging_iter            = 1
max_iter                = 2000

[trainer.callbacks.compile_tokenizer]
compile_after_iterations = 3
enabled                  = false

[trainer.callbacks.grad_clip]
clip_norm    = 1.0
force_finite = true

[checkpoint]
keys_to_skip_loading = ["net_ema."]
load_path            = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter            = 500

[dataloader_train]
max_sequence_length = 54000
max_caption_tokens   = 2048

min_video_frames     = 61
max_video_duration_s = 61.0
max_video_fps        = 15.0

video_backend     = "pyav"
video_tolerance_s = 1e-4

long_video_policy      = "split"
video_window_overlap_s = 2.0
