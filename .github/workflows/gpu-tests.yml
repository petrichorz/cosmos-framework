# Keep the workflow and job names stable for existing branch-protection checks.
# GPU jobs are intentionally omitted because this repository has no matching
# self-hosted H200 runner.
name: GPU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
